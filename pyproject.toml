[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chuckview"
version = "0.1.0"
description = "Find and collect medical images (X-ray, CT) for research datasets."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "PyQt6>=6.7,<7",
    "pydicom>=3.0,<4",
    "pylibjpeg[all]>=2.0",
]

[project.gui-scripts]
chuckview = "chuckview.app:main"

[tool.setuptools]
packages = ["chuckview"]

[tool.setuptools.package-data]
chuckview = ["assets/*"]
