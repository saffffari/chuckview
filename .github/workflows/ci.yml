name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m chuckview --self-test

  windows-build:
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icon.py
      - run: pyinstaller packaging/chuckview.spec --noconfirm
      - name: Self-test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ChuckView\ChuckView.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\ChuckView\self-test.txt
          Remove-Item dist\ChuckView\self-test.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ChuckView -DestinationPath ChuckView-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChuckView-windows
          path: ChuckView-windows.zip
          retention-days: 30
